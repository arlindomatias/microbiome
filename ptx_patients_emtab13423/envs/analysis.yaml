# Downstream statistics and figures (phyloseq, vegan, DESeq2, ANCOM-BC2).
name: analysis
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.5
  - bioconductor-phyloseq
  - bioconductor-deseq2
  - bioconductor-ancombc
  - r-vegan
  - r-ggplot2
  - r-patchwork
  - r-dplyr
  - r-tidyr
  - r-tibble
  - r-readr
